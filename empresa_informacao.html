<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Empresa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/empresa_cadastro_produto.css">
</head>
<body>
    <!-- Header Fixo -->
        <header class="header">
            <div class="container">
                <div class="logo">
                    <span class="logo-text">Agry<span class="logo-highlight">bem</span></span>
                </div>
                 <nav class="nav">  
                <a href="empresa_cadastro.html" class="nav-button">Voltar</a>
            </nav>

        </header>
         <!-- Barra de Progresso -->
        <div class="progress-bar-container">
            <div class="progress-step active">
                <div class="progress-fill"></div>
            </div>
            <div class="progress-step active">
                <div class="progress-fill"></div>
            </div>
            <div class="progress-step ">
                <div class="progress-fill"></div>
            </div>
            <div class="progress-step">
                <div class="progress-fill"></div>
            </div>
            <div class="progress-step">
                <div class="progress-fill"></div>
            </div>
        </div>

        

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <!-- Botão Anterior (Esquerda) -->
       
            

            <!-- Formulário -->
            <div class="form-container">
                <h1 class="form-title">Informações do seu negócio!</h1>
                
                <form class="form">
                    <div class="form-group">
                        <label for="nome" class="form-label">Nome da empresa </label>
                        <input type="text" id="nome" name="nome" class="form-input" placeholder="">
                    </div>

                    <div class="form-group">
                        <label for="telefone" class="form-label">Telefone comercial</label>
                        <input type="text" id="telefone" name="telefone" class="form-input" placeholder="">
                    </div>

                     <div class="form-group">
                        <label for="horário" class="form-label">Horário de funcionamento</label>
                        <input type="text" id="horário" name="horário" class="form-input" placeholder="Ex: Seg - Sex: 07:00 - 17:00 ">
                    </div>

                     <div class="form-group">
                        <label for="link" class="form-label">Link para contato</label>
                        <input type="link" id="link" name="link" class="form-input" placeholder="">
                    </div>
                    
                    

                  

<!-- BOTÃO OK -->
<div class="form-group form-button-ok">
  <a href="empresa_endereco.html" class="ok-button">OK</a>
</div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="container footer-container">
                <div class="footer-logo">
                    <span class="footer-logo-text">Agry<span class="footer-logo-highlight">bem</span></span>
                </div>
                <div class="footer-tagline">
                    Mais que produção, uma relação com você!
                </div>
            </div>
        </footer>
    </div>
</body>
</html>
