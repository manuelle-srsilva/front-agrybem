<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Empresa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/cadastro_produto.css">
</head>
<body>
    <div class="page-wrapper">
        <!-- Header Fixo -->
        <header class="header">
            <div class="container">
                <div class="logo">
                    <span class="logo-text">Agry<span class="logo-highlight">bem</span></span>
                </div>
                 <nav class="nav">  
                <a href="pag_produto.html" class="nav-button">Voltar</a>
            </nav>

        </header>

        

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <!-- Botão Anterior (Esquerda) -->
       
            

            <!-- Formulário -->
            <div class="form-container">
                <h1 class="form-title">Informações do seu produto!</h1>
                
                <form class="form">
                    <div class="form-group">
                        <label for="nome" class="form-label">Nome  </label>
                        <input type="text" id="nome" name="nome" class="form-input" placeholder="">
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">Preço</label>
                        <input type="email" id="email" name="email" class="form-input" placeholder="">
                    </div>

                    <div class="form-group">
  <label for="categoria" class="form-label">Categoria</label>
  <div class="categoria-opcoes">
    <label class="categoria-item">
      <input type="radio" name="categoria" value="Fruta">
      <span>Fruta</span>
    </label>

    <label class="categoria-item">
      <input type="radio" name="categoria" value="Legume">
      <span>Legume</span>
    </label>

    <label class="categoria-item">
      <input type="radio" name="categoria" value="Verdura">
      <span>Verdura</span>
    </label>

    <label class="categoria-item">
      <input type="radio" name="categoria" value="Raiz">
      <span>Raiz</span>
    </label>

    <label class="categoria-item">
      <input type="radio" name="categoria" value="Grãos e Cereais">
      <span>Grãos e Cereais</span>
    </label>

    <label class="categoria-item">
      <input type="radio" name="categoria" value="Ervas e Temperos">
      <span>Ervas e Temperos</span>
    </label>

    <label class="categoria-item">
      <input type="radio" name="categoria" value="Oleaginosas">
      <span>Oleaginosas</span>
    </label>
  </div>
</div>

<!-- UPLOAD DE FOTO -->
<div class="form-group">
  <label class="form-label">Foto</label>
  <div class="upload-box" onclick="document.getElementById('uploadFoto').click()">
    <img src="img/upload-de-arquivo 2.png" alt="Upload" class="upload-icon">
    <input type="file" id="uploadFoto" name="foto" accept="" style="display: none;">
  </div>
</div>

<!-- BOTÃO OK -->
<div class="form-group form-button-ok">
  <a href="pag_produto.html" class="ok-button">OK</a>
</div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="container footer-container">
                <div class="footer-logo">
                    <span class="footer-logo-text">Agry<span class="footer-logo-highlight">bem</span></span>
                </div>
                <div class="footer-tagline">
                    Mais que produção, uma relação com você!
                </div>
            </div>
        </footer>
    </div>
</body>
</html>
