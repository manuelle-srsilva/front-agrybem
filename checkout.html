<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrybem - Finalizar Compra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/loja.css"> 
    <link rel="stylesheet" href="style/checkout.css"> <!-- Novo CSS para o checkout -->
    <script src="js/carrinho.js" defer></script> <!-- Reutiliza a lógica de carrinho -->
    <script src="js/checkout.js" defer></script> <!-- Novo JS para o checkout -->
</head>
<body>
    <!-- Header (Reutilizado do carrinho.html) -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <span class="logo-text">Agry<span class="logo-highlight">bem</span></span>
            </div>
            <nav class="nav">
                <a href="carrinho.html" class="nav-button">Voltar ao carrinho</a>
            </nav>
        </div>
    </header>

    <!-- Conteúdo do Checkout -->
    <main class="checkout-page-content">
        <div class="container">
            <h1 class="checkout-title">Finalizar Pedido</h1>

            <div class="checkout-grid">
                <!-- Card 1: Resumo do Pedido -->
                <div class="checkout-card order-summary-card">
                    <h2 class="card-title">Seu Pedido</h2>
                    <div id="order-items-container">
                        <!-- O resumo do pedido será injetado aqui pelo JavaScript -->
                        <div class="empty-order-message">
                            Nenhum item no pedido. <a href="loja.html">Voltar à Loja</a>.
                        </div>
                    </div>
                    <div class="summary-total-line">
                        <span class="summary-total-label">Total Geral:</span>
                        <span class="summary-total-value" id="checkout-grand-total">R$ 0,00</span>
                    </div>
                </div>

                <!-- Card 2: Agendamento de Retirada -->
                <div class="checkout-card schedule-card">
                    <h2 class="card-title">Agendamento de Retirada</h2>
                    <form id="schedule-form">
                        <div class="form-group">
                            <label for="pickup-date">Data de Retirada:</label>
                            <input type="date" id="pickup-date" name="pickup-date" required>
                        </div>
                        <div class="form-group">
                            <label for="pickup-time">Hora de Retirada:</label>
                            <input type="time" id="pickup-time" name="pickup-time" required>
                        </div>
                        <button type="submit" class="confirm-order-btn" disabled>Confirmar Pedido</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
