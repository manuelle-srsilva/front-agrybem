<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Empresa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/formulario.css">
</head>
<body>
    <div class="page-wrapper">
        <!-- Header Fixo -->
        <header class="header">
            <div class="container">
                <div class="logo">
                    <span class="logo-text">Agry<span class="logo-highlight">bem</span></span>
                </div>
                 <nav class="nav">  
                <a href="empresa_login.html" class="nav-button">Voltar</a>
            </nav>

        </header>

        

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <!-- Botão Anterior (Esquerda) -->
       
            

            <!-- Formulário -->
            <div class="form-container">
                <h1 class="form-title">Insira seus dados para recuperação de senha!</h1>
                
                <form class="form">
                    <div class="form-group">
                        <label for="nome" class="form-label">CPF ou CNPJ </label>
                        <input type="text" id="nome" name="nome" class="form-input" placeholder="">
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">E-mail comercial</label>
                        <input type="email" id="email" name="email" class="form-input" placeholder="">
                    </div>

            

                   

<!-- BOTÃO OK -->
<div class="form-group form-button-ok">
  <a href="empresa-redefinicao-senha.html" class="ok-button">Continuar</a>
</div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="container footer-container">
                <div class="footer-logo">
                    <span class="footer-logo-text">Agry<span class="footer-logo-highlight">bem</span></span>
                </div>
                <div class="footer-tagline">
                    Mais que produção, uma relação com você!
                </div>
            </div>
        </footer>
    </div>
</body>
</html>
