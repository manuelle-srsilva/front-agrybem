<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cesta Rural - Agrybem</title>
    <link rel="stylesheet" href="style/cliente_perfil.css">
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <span class="logo-text">Agry<span class="logo-highlight">bem</span></span>
            </div>
            <nav class="nav">
             
                <a href="clientepagprincipal.html" class="nav-button">Voltar</a>
            </nav>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-content">
       

        <!-- HEADER SECTION WITH LOGO AND TITLE -->
        <section class="header-section">

            <div class="container">
                    <div class="header-info">
                        <h1 class="institution-title">Maria Lurdes</h1>
                        <button class="edit-button">✎</button>
                    </div>

            </div>
        </section>

        <!-- INSTITUTION INFO SECTION -->
        <section class="info-section">
            <div class="container">
                <h2 class="section-title">Suas Informações</h2>
                <div class="form-group">
                    <form class="institution-form">
                        <div class="form-field">
                            <label for="responsible">Nome</label>
                            <input type="text" id="responsible" placeholder="Maria Lurdes" disabled>
                        </div>

                        <div class="form-field">
                            <label for="email">Email</label>
                            <input type="email" id="email" placeholder="marialurdes@gmail.com" disabled>
                        </div>

                      
                        <div class="form-field">
                            <label for="password">Senha</label>
                            <input type="password" id="password" placeholder="908765433" disabled>
                        </div>
                    </form>
                </div>
            </div>
        </section>

       
    <!-- FOOTER -->
   <footer class="footer">
        <div class="container footer-container">
            <div class="footer-logo">
                
                <span class="footer-logo-text">Agry<span class="footer-logo-highlight">bem</span></span>
            </div>
            <div class="footer-tagline">
                Mais que produção, uma relação com você!
            </div>
        </div>
    </footer>
</body>
</html>
