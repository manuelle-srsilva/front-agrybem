<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cesta Rural - Agrybem</title>
    <link rel="stylesheet" href="style/cliente_perfil.css">
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <span class="logo-text">Agry<span class="logo-highlight">bem</span></span>
            </div>
            <nav class="nav">
                <a href="clientepagprincipal.html" class="nav-button">Voltar</a>
            </nav>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- HEADER SECTION WITH LOGO AND TITLE -->
        <section class="header-section">
            <div class="container">
                <div class="header-top">
                    <div class="logo-institution">
                        <button class="photo-edit-button" title="Trocar Foto">✎</button>
                        <img src="img/Moça perfil.png" alt="Logo da Empresa" class="logo-img">
                    </div>

                    <div class="header-info">
                        <h1 class="institution-title">Maria Lurdes</h1>
                    </div>
                </div>
            </div>
        </section>

       

        <!-- INSTITUTION INFO CARD -->
        <section class="card-section">
            <div class="container">
                <div class="card" data-card="institution">
                    <div class="card-header">
                        <h2 class="card-title">Informações Pessoais</h2>
                        <button class="card-edit-button" title="Editar">✎</button>
                    </div>
                    <!-- REMOVIDO: style="display: none;" -->
                    <div class="card-actions">
                        <button class="card-save-button" title="Salvar">✓</button>
                        <button class="card-cancel-button" title="Cancelar">✕</button>
                    </div>
                      <div class="form-field">
                            <label for="company-name">Nome </label>
                            <input type="text" id="company-name" value="Maria Lurdes" disabled>
                        </div>

                        <div class="form-field">
                            <label for="company-name">E-mail</label>
                            <input type="text" id="company-name" value="mariaLurdes@gmail.com" disabled>
                        </div>

                         <div class="form-field">
                            <label for="company-name">Telefone</label>
                            <input type="text" id="company-name" value="71986950177" disabled>
                        </div>

        

                        <div class="form-field">
                            <label for="password">Senha</label>
                            <input type="text" id="password" value="every345" disabled>
                        </div>
                    </form>
                </div>
            </div>
        </section>

      

     

   
   
  
    <script src="js/empresa_perfil.js"></script>
</body>
</html>
