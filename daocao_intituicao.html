<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cesta Rural - Agrybem</title>
    <link rel="stylesheet" href="style/loja.css">
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <span class="logo-text">Agry<span class="logo-highlight">bem</span></span>
            </div>
            <nav class="nav">
             
                <a href="doacao_pag_principal.html" class="nav-button">Voltar</a>
            </nav>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-content">
       

        <!-- HEADER SECTION WITH LOGO AND TITLE -->
        <section class="header-section">

            <div class="container">
                <div class="header-top">
                    <div class="logo-institution">
                        <img src="img/instituição 1.png" alt="Logo da Empresa" class="logo-img">
                    </div>
                      <div class="header-info">
                        <h1 class="institution-title">Mesa Solidária
                       
                    </div>

                </div>
                <div class="form-field">
                            <label for="company-name">Descrição</label>
                            <h3>Somos uma intituição, onde direcionamos doações a quem mais precisa na região de Camaçari
                        </div>


            </div>
        </section>

       

        <!-- ADDRESS SECTION -->
        <section class="address-section">
            <div class="container">
                <h2 class="section-title">Endereço</h2>
                <div class="form-group">
                    <form class="address-form">
                        <div class="form-field">
                            <label for="cep">CEP</label>
                            <input type="text" id="cep" placeholder="42835-000" disabled>
                        </div>

                        <div class="form-field">
                            <label for="street">Rua</label>
                            <input type="text" id="street" placeholder="R. Elvo Urbano Central" disabled>
                        </div>

                        <div class="form-field">
                            <label for="number">Número</label>
                            <input type="text" id="number" placeholder="789" disabled>
                        </div>

                        <div class="form-field">
                            <label for="neighborhood">Bairro</label>
                            <input type="text" id="neighborhood" placeholder="Centro" disabled>
                        </div>

                        <div class="form-field">
                            <label for="city">Cidade</label>
                            <input type="text" id="city" placeholder="Camaçari" disabled>
                        </div>

                        <div class="form-field">
                            <label for="state">Estado</label>
                            <input type="text" id="state" placeholder="BA" disabled>
                        </div>

                        <div class="form-field">
                            <label for="reference">Ponto de Referência</label>
                            <input type="text" id="reference" placeholder="Praça Abrantes" disabled>
                        </div>
                    </form>
                </div>
            </div>
        </section>

 <section class="address-section">
            <div class="container">
                <h2 class="section-title">Falar com intituição<div class="form-group">
                    <form class="address-form">
                       
                        <div class="form-field">
                           <label for="reference">whatsapp</label>
                            <input type="text" id="reference" placeholder="LINK DO WHTAS" disabled>
                        </div>
                    </form>
                </div>
            </div>
        </section>





        <!-- MAP SECTION -->
        <section class="map-section">
            <div class="container">
                <div class="map-placeholder">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3907.8624123456789!2d-38.3456789!3d-12.7654321!  " width="100%" height="400" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
            </div>
        </section>
    </main>
   


    <!-- FOOTER -->
   <footer class="footer">
        <div class="container footer-container">
            <div class="footer-logo">
                
                <span class="footer-logo-text">Agry<span class="footer-logo-highlight">bem</span></span>
            </div>
            <div class="footer-tagline">
                Mais que produção, uma relação com você!
            </div>
        </div>
    </footer>
</body>
</html>
