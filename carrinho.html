<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrybem - Carrinho de Compras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/loja.css">
    <link rel="stylesheet" href="style/carrinho.css">
    <script src="js/carrinho.js" defer></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <span class="logo-text">Agry<span class="logo-highlight">bem</span></span>
            </div>
            <nav class="nav">
                <a href="loja.html" class="nav-button">Voltar à Loja</a>
            </nav>
        </div>
    </header>

    <!-- Conteúdo do Carrinho -->
    <main class="cart-page-content">
        <div class="container">
            <h1 class="cart-title">Seu Carrinho </h1>

            <!-- Lista de Itens do Carrinho -->
            <div id="cart-items-container">
                <!-- Os itens do carrinho serão injetados aqui pelo JavaScript -->
                <div class="empty-cart-message" id="empty-cart-message">
                    Seu carrinho está vazio. <a href="loja.html">Voltar à Loja</a> para adicionar produtos.
                </div>
            </div>

            <!-- Resumo do Carrinho -->
            <div class="cart-summary">
                <div class="summary-details">
                    <span class="summary-total-label">Total Geral:</span>
                    <span class="summary-total-value" id="grand-total">R$ 0,00</span>
                </div>
                <button class="checkout-btn" disabled><a href="checkout.html"></a>Finalizar pedido</button>
            </div>
        </div>
    </main>
</body>
</html>
