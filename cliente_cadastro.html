<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Empresa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/empresa_cadastro_produto.css">
</head>
<body>
    <div class="page-wrapper">
        <!-- Header Fixo -->
        <header class="header">
            <div class="container">
                <div class="logo">
                    <span class="logo-text">Agry<span class="logo-highlight">bem</span></span>
                </div>
                 <nav class="nav">  
                <a href="cliente_login.html" class="nav-button">Voltar</a>
            </nav>

        </header>

        

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <!-- Botão Anterior (Esquerda) -->
       
            

            <!-- Formulário -->
            <div class="form-container">
                <h1 class="form-title">Coloque suas informações!</h1>
                
                <form class="form">
                    <div class="form-group">
                        <label for="nome" class="form-label">Digite seu nome </label>
                        <input type="text" id="nome" name="nome" class="form-input" placeholder="">
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" id="email" name="email" class="form-input" placeholder="">
                    </div>
                     <div class="form-group">
                        <label for="email" class="form-label">Telefone</label>
                        <input type="email" id="email" name="email" class="form-input" placeholder="">
                    </div>

                      <div class="form-group">
                        <label for="email" class="form-label">Senha</label>
                        <input type="email" id="email" name="email" class="form-input" placeholder="">
                    </div>

                      <div class="form-group">
                        <label for="email" class="form-label">Confirmação de senha</label>
                        <input type="email" id="email" name="email" class="form-input" placeholder="">
                    </div>

               

<!-- BOTÃO OK -->
<div class="form-group form-button-ok">
  <a href="cliente_login.html" class="ok-button">OK</a>
</div>
        </main>

        
    </div>
</body>
</html>
